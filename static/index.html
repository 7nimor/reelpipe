<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>reelpipe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #10120f;
      --panel: rgba(22, 26, 20, 0.72);
      --fog: #c7d2b8;
      --mute: #8a9478;
      --acid: #d7ff4a;
      --acid-deep: #b6db28;
      --line: rgba(215, 255, 74, 0.18);
      --danger: #ff6b4a;
      --ok: #7dffb3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      color: var(--fog);
      font-family: "Vazirmatn", sans-serif;
      background:
        radial-gradient(1200px 700px at 85% -10%, rgba(215, 255, 74, 0.16), transparent 55%),
        radial-gradient(900px 600px at -10% 110%, rgba(90, 140, 70, 0.18), transparent 50%),
        linear-gradient(160deg, #0b0d0a 0%, #151912 45%, #0e110d 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.08;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      animation: grain 1.2s steps(2) infinite;
      z-index: 0;
    }

    @keyframes grain {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-1.5%, 1%); }
    }

    .frame {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2.5rem 1.25rem 3rem;
    }

    .stage {
      width: min(720px, 100%);
      display: grid;
      gap: 1.75rem;
      justify-items: center;
      text-align: center;
    }

    .brand {
      font-family: "Syne", sans-serif;
      font-weight: 800;
      font-size: clamp(3.4rem, 12vw, 6.2rem);
      letter-spacing: -0.04em;
      line-height: 0.9;
      color: #f4f7ea;
      text-transform: lowercase;
      animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .brand span {
      color: var(--acid);
    }

    .tag {
      max-width: 28rem;
      color: var(--mute);
      font-size: 1.05rem;
      line-height: 1.7;
      animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.08s both;
    }

    .run {
      appearance: none;
      border: 0;
      cursor: pointer;
      margin-top: 0.4rem;
      min-width: 220px;
      padding: 1.05rem 2.4rem;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--acid), var(--acid-deep));
      color: #12150f;
      font-family: "Vazirmatn", sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.01em;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 18px 40px rgba(215, 255, 74, 0.18);
      transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
      animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.16s both;
    }

    .run:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 22px 50px rgba(215, 255, 74, 0.28);
      filter: brightness(1.05);
    }

    .run:active:not(:disabled) {
      transform: translateY(1px) scale(0.99);
    }

    .run:disabled {
      cursor: wait;
      filter: saturate(0.7);
      opacity: 0.75;
    }

    .status {
      min-height: 1.5rem;
      font-size: 0.95rem;
      color: var(--mute);
      animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.22s both;
    }

    .status.busy { color: var(--acid); }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--danger); }

    .log-wrap {
      width: 100%;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      border: 1px solid transparent;
      border-radius: 18px;
      background: var(--panel);
      backdrop-filter: blur(10px);
      transition: max-height 0.55s ease, opacity 0.4s ease, border-color 0.4s ease;
    }

    .log-wrap.open {
      max-height: 360px;
      opacity: 1;
      border-color: var(--line);
    }

    .log {
      max-height: 360px;
      overflow: auto;
      padding: 1rem 1.1rem;
      text-align: right;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.82rem;
      line-height: 1.65;
      color: #d5dfc4;
      direction: ltr;
      unicode-bidi: plaintext;
    }

    .log div {
      opacity: 0;
      transform: translateY(6px);
      animation: line-in 0.35s ease forwards;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .log div.err { color: var(--danger); }
    .log div.ok { color: var(--ok); }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes line-in {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      .run { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <section class="stage">
      <h1 class="brand">reel<span>pipe</span></h1>
      <p class="tag">پیدا کردن آخرین ریل، دانلود، و آپلود روی پیج خودت — همه در یک اجرا</p>
      <button class="run" id="run" type="button">شروع</button>
      <p class="status" id="status">آماده</p>
      <div class="log-wrap" id="logWrap">
        <div class="log" id="log"></div>
      </div>
    </section>
  </main>
  <script>
    const runBtn = document.getElementById("run");
    const statusEl = document.getElementById("status");
    const logEl = document.getElementById("log");
    const logWrap = document.getElementById("logWrap");
    let timer = null;
    let lastLen = 0;

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    function appendLines(lines) {
      if (!lines.length) return;
      logWrap.classList.add("open");
      for (const item of lines) {
        const row = document.createElement("div");
        const text = item.msg || "";
        row.textContent = text;
        if (item.level === "error" || text.startsWith("Error:")) row.className = "err";
        if (text.startsWith("ok:") || text.startsWith("marked:")) row.className = "ok";
        logEl.appendChild(row);
      }
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function poll() {
      try {
        const res = await fetch("/api/logs");
        const data = await res.json();
        if (data.logs.length > lastLen) {
          appendLines(data.logs.slice(lastLen));
          lastLen = data.logs.length;
        }
        if (!data.running) {
          clearInterval(timer);
          timer = null;
          runBtn.disabled = false;
          if (data.error) setStatus("خطا", "err");
          else if (data.result) setStatus("آپلود شد: " + data.result, "ok");
          else setStatus("تمام", "ok");
        }
      } catch (err) {
        clearInterval(timer);
        timer = null;
        runBtn.disabled = false;
        setStatus("قطع ارتباط", "err");
      }
    }

    runBtn.addEventListener("click", async () => {
      if (runBtn.disabled) return;
      runBtn.disabled = true;
      logEl.innerHTML = "";
      lastLen = 0;
      logWrap.classList.add("open");
      setStatus("در حال اجرا...", "busy");
      try {
        const res = await fetch("/api/run", { method: "POST" });
        const data = await res.json();
        if (!res.ok) {
          setStatus(data.error || "خطا", "err");
          runBtn.disabled = false;
          return;
        }
        timer = setInterval(poll, 600);
        poll();
      } catch (err) {
        setStatus("اجرا شروع نشد", "err");
        runBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
